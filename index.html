<meta name="theme-color" content="#121212">
<style>
:root{--bg:#121212;--card:#1c1c1c;--tx:#f4f4ee;--mut:#a5a59c;--ac:#c9da2a;--acx:#161616;--ln:#2e2e2e;--ok:#43b863;--wa:#f5a524;--rd:#e5484d;--gr:#2f9e44;box-sizing:border-box;color-scheme:dark}
html{scroll-behavior:smooth}
body{margin:0;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 420px at 100% -10%,rgba(201,218,42,.13),transparent 60%) fixed,radial-gradient(700px 420px at -10% 110%,rgba(47,158,68,.18),transparent 60%) fixed,#121212}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:linear-gradient(180deg,#0b0b0b,#181818);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,var(--gr),var(--ac),var(--gr))}
.top .gallo{height:46px;width:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}
.top .wm{height:36px;width:auto}
.top .lema{margin-left:auto;font-size:12px;color:var(--mut);text-align:right;max-width:150px;line-height:1.2}
.top .acc{margin-left:auto;display:flex;gap:8px;align-items:center}
.top .acc button,.top .acc a.b{padding:6px 12px;font-size:14px}
@media(max-width:480px){.top .lema{display:none}.top .wm{height:30px}.top .gallo{height:40px}}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom,0px))}
h1{font-size:23px;margin:4px 0 6px}
h2{font-size:15px;margin:22px 0 8px;color:var(--ac);text-transform:uppercase;letter-spacing:.05em}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
button,a.b{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .12s,filter .12s}
button:hover,a.b:hover{filter:brightness(1.08)}
button:active{transform:scale(.96)}
button.g{background:transparent;color:var(--tx);border:1px solid #3d3d3d;font-weight:600}
button.q{width:36px;padding:7px 0}
input,select{font:inherit;padding:9px;border:1px solid #3a3a3a;border-radius:10px;background:#141414;color:var(--tx);width:120px;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.tag{font-size:12px;border-radius:99px;padding:2px 10px;border:1px solid var(--ln)}
.Nuevo{color:var(--wa)}.Preparando{color:var(--ac)}.Listo{color:var(--ok)}.Entregado{color:var(--mut)}.Cancelado{color:var(--rd)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
textarea{font:inherit;padding:9px;border:1px solid #3a3a3a;border-radius:10px;background:#141414;color:var(--tx);width:100%;box-sizing:border-box;margin-top:6px}
.note{margin-top:6px;padding:6px 10px;border-radius:8px;border:1px dashed var(--wa);color:var(--wa);font-size:14px}
.open{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:#15803d;color:#fff;padding:10px 18px;border-radius:12px;font-size:15px;z-index:40;display:none;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
ul{margin:8px 0 0;padding-left:20px}
hr{border:0;border-top:1px dashed var(--ln);margin:10px 0}
.ph{width:72px;height:54px;object-fit:cover;border-radius:8px;flex:none;background:var(--ln)}
.lft{display:flex;align-items:center;gap:12px;min-width:0}
.chips{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:12;display:flex;gap:8px;overflow-x:auto;padding:8px 16px;margin:0 -16px;background:linear-gradient(#121212 72%,rgba(18,18,18,0));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #3d3d3d;border-radius:99px;padding:6px 14px;background:#1c1c1c;color:var(--tx);font-size:14px;font-weight:600}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.sec{scroll-margin-top:118px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{position:relative;background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.pc.ent{opacity:0;transform:translateY(14px);animation:ent .45s ease forwards}
.pc:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.55)}
.pc .im{position:relative;aspect-ratio:4/3;cursor:zoom-in;overflow:hidden;background:#222}
.pc .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.pc:hover .im img{transform:scale(1.07)}
.pc .pr{position:absolute;right:8px;bottom:8px;background:var(--ac);color:var(--acx);font-weight:800;border-radius:99px;padding:3px 10px;font-size:14px}
.pc .promo{position:absolute;left:8px;top:8px;background:var(--rd);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px}
.pc .bd{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .nm{font-weight:700;line-height:1.2}
.pc .ds{font-size:12.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .ctl{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:38px}
.pc.ago .im::after{content:"AGOTADO";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.62);font-weight:800;letter-spacing:.12em}
@keyframes ent{to{opacity:1;transform:none}}
.lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.lb .box{width:min(520px,100%);background:var(--card);border-radius:22px 22px 0 0;overflow:hidden;max-height:92vh;overflow-y:auto;animation:sube .25s ease}
.lb img.gr{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
@keyframes fd{from{opacity:0}}
@keyframes sube{from{transform:translateY(40px)}}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:18;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,#0b0b0b 65%,rgba(11,11,11,0))}
.cartbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1c1c1c;border:1px solid var(--ac);border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.pulso{animation:pl 1.3s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.6)}50%{box-shadow:0 0 0 10px rgba(229,72,77,0)}}
@media print{
 body *{visibility:hidden}
 #ticket,#ticket *{visibility:visible}
 #ticket{position:absolute;left:0;top:0;width:100%;border:0;background:#fff;color:#000}
 #ticket .mut{color:#444}
}
</style>
</head>

function setSes(s){ses=s;try{s?localStorage.setItem("qr_ses",JSON.stringify(s)):localStorage.removeItem("qr_ses")}catch(e){}}
function norm(d){return{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(Date.now()/1000)+d.expires_in}}
async function rawAuth(grant,body){
 const r=await fetch(SB_URL+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
 const d=await r.json();if(!r.ok)throw new Error(d.msg||d.error_description||d.message||"No se pudo iniciar sesión");return d}
async function refresh(){
 if(!ses||ses.expires_at-Date.now()/1000>60)return;
 try{const rl=ses.rol;const n=norm(await rawAuth("refresh_token",{refresh_token:ses.refresh_token}));n.rol=rl;setSes(n)}catch(e){setSes(null)}}
async function api(path,o={}){
 const h={apikey:SB_KEY,"Content-Type":"application/json"};
 if(o.auth){await refresh();if(!ses){render();throw new Error("Sesión vencida, entra de nuevo")}h.Authorization="Bearer "+ses.access_token}
 if(o.prefer)h.Prefer=o.prefer;
 const ac=new AbortController(),to=setTimeout(()=>ac.abort(),12000);
 let r,t;
 try{r=await fetch(SB_URL+path,{method:o.method||"GET",headers:h,body:o.body?JSON.stringify(o.body):undefined,signal:ac.signal});t=await r.text()}
 catch(e){throw new Error(e.name==="AbortError"?"La conexión tardó demasiado. Reintentando…":"Sin conexión. Reintentando…")}
 finally{clearTimeout(to)}
 let d=null;try{d=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){if(r.status===401&&o.auth){setSes(null);render()}throw new Error((d&&(d.message||d.msg||d.error_description))||"Error "+r.status)}
 return d}

function route(){
 const r=location.hash.slice(1);let m=r.match(/^cliente-(\d+)$/);if(m)return{t:"cliente",m:m[1]};
 if(/^mesero(-\d+)?$/.test(r))return{t:"mesero"};
 if(r==="cocina")return{t:"cocina"};if(r==="personal")return{t:"personal"};
 m=r.match(/^admin(?:-(caja|usuarios))?$/);if(m)return{t:"admin",tab:m[1]||"menu"};
 return{t:"landing"}}
/* ---------- carga de datos: UNA sola consulta, cada 2-3 segundos ---------- */
async function load(force){
 const R=route();
 if(R.t==="landing"||R.t==="personal"||(R.t!=="cliente"&&!puede(R.t)))return;
 if(inflight&&!force)return;
 const my=++tok;inflight=true;
 try{
  const d=R.t==="cliente"?await rpc("estado_mesa",{p_mesa:R.m,p_token:getTok(R.m)}):
   R.t==="admin"?await rpc(R.tab==="caja"?"resumen_caja":R.tab==="usuarios"?"admin_usuarios":"admin_productos",{},true):
   R.t==="cocina"?await rpc("panel_cocina",{},true):await rpc("panel_mesero",{},true);
  if(my!==tok)return;
  errMsg="";const recup=!!lastErr;lastErr="";
  try{avisos(R,d)}catch(e){}
  const s=JSON.stringify(d);
  if(loaded&&s===sig&&!force&&!recup)return;
  const typing=document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(loaded&&typing&&!force&&!recup){
   if(R.t==="mesero"&&$("#lista")){P=d;orders=d.pedidos||[];$("#lista").innerHTML=listaMesero()}
   return}
  sig=s;
  if(R.t==="cliente"){menu=d.menu||[];E=d}else if(R.t==="admin")A=d;else{menu=d.menu||[];P=d;orders=d.pedidos||[]}
  loaded=true;render();
 }catch(x){if(my===tok){if(loaded){if(lastErr!==x.message){lastErr=x.message;render()}}else{errMsg=x.message;render()}}}
 finally{if(my===tok)inflight=false}
}

async function getRol(){

 try{const r=(await rpc("mi_rol",{},true))||"ninguno";const ch=!!ses&&ses.rol!==r;if(ses){ses.rol=r;setSes(ses)}

  if(ch){render();load()}}catch(e){}}

 if(!mesa){toast("Escribe el número de mesa",true);return}
 const items=cartItems();if(!items.length&&!nota.trim())return;
 const R=route();busy=true;
 try{
  const r=await rpc("crear_pedido",{p_mesa:String(mesa),p_items:items.map(i=>({id:i.id,q:i.q})),p_nota:nota.trim(),p_token:R.t==="cliente"?getTok(mesa):""});
  if(R.t==="cliente")setTok(mesa,r.token);
  cart={};nota="";
  toast(R.t==="cliente"?"✅ Pedido #"+r.pedido_id+" enviado a cocina. Código de tu mesa: "+r.token:"✅ Pedido #"+r.pedido_id+" agregado a la mesa "+mesa+" y enviado a cocina");
  await load(true);
 }catch(x){toast(x.message,true);await load(true)}
 busy=false}

function achicar(file){return new Promise((ok,no)=>{
 const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error("No se pudo procesar la imagen")),"image/jpeg",0.82)};
 img.onerror=()=>{URL.revokeObjectURL(u);no(new Error("No se pudo leer la imagen"))};img.src=u})}
async function subirArchivo(file){
 if(!file||!/^image\//.test(file.type))throw new Error("Elige un archivo de imagen");
 const blob=await achicar(file);
 await refresh();if(!ses)throw new Error("Sesión vencida, entra de nuevo");
 const name="p_"+Date.now()+"_"+Math.random().toString(36).slice(2,8)+".jpg";
 const r=await fetch(SB_URL+"/storage/v1/object/productos/"+name,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+ses.access_token,"Content-Type":"image/jpeg"},body:blob});
 const t=await r.text();let d=null;try{d=JSON.parse(t)}catch(e){}
 if(!r.ok)throw new Error((d&&(d.message||d.error))||"No se pudo subir la foto");
 return SB_URL+"/storage/v1/object/public/productos/"+name}
async function subirFoto(inp){
 const f=inp.files&&inp.files[0];if(!f)return;toast("Subiendo foto…");

 return h}
function cajaHTML(r,title,print){
 const met=Object.entries(r.por_metodo||{}).map(([k,v])=>'<div class="row"><span>'+esc(cap(k))+'</span><span>'+money(v)+'</span></div>').join("")||'<div class="mut">—</div>';
 const prod=(r.por_producto||[]).map(p=>'<div class="row"><span>'+p.q+'× '+esc(p.n)+'</span><span>'+money(p.total)+'</span></div>').join("")||'<div class="mut">—</div>';
 return '<div'+(print?' id="ticket"':'')+' class="card" style="max-width:480px"><b>'+esc(title)+'</b>'+
 '<div class="mut">'+(r.desde?'Desde: '+fmt(r.desde)+'<br>':'')+(r.cerrado_at?'Cierre: '+fmt(r.cerrado_at):'Hasta este momento')+'</div><hr>'+
 '<div class="row"><span>Cuentas cerradas</span><b>'+r.cuentas+'</b></div><div class="row"><span>Pedidos</span><b>'+r.pedidos+'</b></div><hr>'+
 '<div class="row" style="font-size:20px"><b>Dinero ingresado</b><b>'+money(r.ventas)+'</b></div>'+ivaRows(r.ventas)+'<hr><b>Por método de pago</b>'+met+'<hr><b>Por producto</b>'+prod+'</div>'}

 if(!confirm("¿Cerrar la caja? Se guardará el corte con las ventas actuales."))return;

function verCierre(id){const h=(A.historial||[]).find(x=>x.id===id);if(!h)return;
 cajaRep={folio:h.id,desde:h.desde,cerrado_at:h.created_at,cuentas:h.cuentas,pedidos:h.pedidos,ventas:h.ventas,por_metodo:h.por_metodo,por_producto:h.por_producto};render();scrollTo(0,0)}
function desgloseIVA(total){const r=n=>Math.round(n*100)/100,t=Number(total)||0,sub=IVA?r(t/(1+IVA)):t;return{sub:sub,iva:r(t-sub)}}
function ivaRows(total){if(!IVA)return"";const d=desgloseIVA(total);
 return '<div class="row mut"><span>Subtotal</span><span>'+money(d.sub)+'</span></div><div class="row mut"><span>IVA '+Math.round(IVA*100)+'%</span><span>'+money(d.iva)+'</span></div>'}
async function exportar(id){
 try{
  const t=await rpc("tickets_cierre",id?{p_cierre:id}:{},true);
  if(!t.length){toast("No hay tickets para exportar",true);return}
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const f=d=>{if(!d)return"";const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16).replace("T"," ")};
  const rows=[["Folio","Mesa","Apertura","Cierre","Método de pago","Subtotal","IVA","Total"]];
  t.forEach(c=>{const d=desgloseIVA(c.total);rows.push([c.folio,c.mesa,f(c.abierta_at),f(c.cerrada_at),cap(c.metodo),d.sub.toFixed(2),d.iva.toFixed(2),Number(c.total).toFixed(2)])});
  const csv="\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=(id?"cierre-"+id:"tickets-pendientes")+".csv";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("✅ Archivo descargado (ábrelo con Excel)");
 }catch(x){toast(x.message,true)}}

 h+='<h2>Ventas desde el último cierre</h2>';
 h+=a.cuentas?cajaHTML(a,"Resumen actual",false):'<div class="mut">No hay ventas nuevas por cerrar.</div>';
 if(a.abiertas)h+='<div class="card" style="border-color:#b91c1c">Hay <b>'+a.abiertas+'</b> cuenta(s) abierta(s). Pide al mesero que las cierre para poder cerrar la caja.</div>';
 h+='<p><button '+(a.cuentas&&!a.abiertas?"":"disabled")+' onclick="cerrarCaja()">Cerrar caja</button> <button class="g" '+(a.cuentas?"":"disabled")+' onclick="exportar(null)">Descargar tickets pendientes (Excel)</button></p>';
 h+='<h2>Cierres anteriores</h2>'+(his.length?his.map(x=>'<div class="card row"><span>#'+x.id+' · '+fmt(x.created_at)+'<div class="mut">'+x.cuentas+' cuentas · '+x.pedidos+' pedidos</div></span><span class="row"><b>'+money(x.ventas)+'</b><button class="g" onclick="verCierre('+x.id+')">Ver</button><button class="g" onclick="exportar('+x.id+')">Excel</button></span></div>').join(""):'<div class="mut">Aún no hay cierres.</div>');
 return h}

/* ---------- marca, avisos sonoros, cancelar y mesas ---------- */
function marca(){return""}
let AC=null,sonido=true,prevK=null;try{sonido=localStorage.getItem("qr_sonido")!=="0"}catch(e){}
function ctx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}return AC}
function beep(){const c=ctx();if(!c)return;if(c.state==="suspended")c.resume();
 [0,.25,.5].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=i%2?880:1175;g.gain.value=.25;o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.18)})}
function toggleSonido(){sonido=!sonido;try{localStorage.setItem("qr_sonido",sonido?"1":"0")}catch(e){}if(sonido){ctx();beep()}render()}
function sonidoBtn(){
 const listo=AC&&AC.state==="running";
 let h='<p class="row" style="justify-content:flex-start;flex-wrap:wrap;gap:8px">';
 h+=sonido?(listo?'<button class="g" onclick="toggleSonido()">🔔 Sonido activado</button>':'<button class="pulso" onclick="desbloquear()">🔔 Toca aquí para activar los avisos</button>'):'<button class="g" onclick="toggleSonido()">🔕 Activar sonido</button>';
 if("Notification" in window&&Notification.permission==="default")h+='<button class="g" onclick="pedirNotif()">📣 Permitir notificaciones</button>';
 return h+'</p>'}
function desbloquear(){const c=ctx();if(c){c.resume().then(()=>{beep();render()}).catch(()=>render())}else render()}
function notificar(t,c){try{if("Notification" in window&&Notification.permission==="granted")new Notification(t,{body:c,tag:"avisos"})}catch(e){}if(navigator.vibrate){try{navigator.vibrate([250,120,250])}catch(e){}}}
function pedirNotif(){try{Notification.requestPermission().then(()=>render())}catch(e){}}
async function pantalla(){try{if("wakeLock" in navigator&&!WL){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}}catch(e){}}
document.addEventListener("click",()=>{if(sonido){const c=ctx();if(c&&c.state==="suspended")c.resume()}});
function avisos(R,d){
 const k=new Set();
 if(R.t==="cocina"){(d.pedidos||[]).forEach(o=>{if(o.estado==="Nuevo")k.add("p"+o.id)})}
 else if(R.t==="mesero"){(d.llamadas||[]).forEach(m=>k.add("l"+m));(d.pedidos||[]).forEach(o=>{if(o.estado==="Listo")k.add("p"+o.id)})}
 else{document.title=NOMBRE;prevK=null;return}
 document.title=(k.size?"("+k.size+") ":"")+(R.t==="cocina"?"Cocina":"Mesero")+" · "+NOMBRE;
 if(prevK){const nu=[...k].filter(x=>!prevK.has(x));
  if(nu.length){const x=nu[0],id=x.slice(1);
   const msg=x[0]==="l"?"🔔 Mesa "+id+" llama al mesero":R.t==="mesero"?"✅ Pedido #"+id+" listo para entregar":"🔔 Nuevo pedido #"+id;
   if(sonido)beep();toast(msg);notificar(NOMBRE,msg)}}
 prevK=k}
async function cancelar(id){
 if(!confirm("¿Cancelar este pedido?"))return;
 const R=route();
 try{await rpc("cancelar_pedido",{p_id:id,p_token:R.t==="cliente"?getTok(R.m):""},R.t!=="cliente");toast("Pedido cancelado");await load(true)}catch(x){toast(x.message,true)}}
async function cargarMesas(){
 const t=route().t;if(t!=="personal"&&t!=="admin")return;
 try{const n=await rpc("mesas_total");if(n){nMesas=n;render()}}catch(e){}}
function mesasHTML(){return '<div class="card row"><span>Mesas del restaurante</span><span class="row"><input id="nm" type="number" min="1" max="60" value="'+nMesas+'" style="width:80px"><button onclick="guardarMesas()">Guardar</button></span></div>'}
async function guardarMesas(){
 const n=parseInt($("#nm").value,10);if(!(n>=1&&n<=60)){toast("Escribe un número de 1 a 60",true);return}
 try{await rpc("admin_set_mesas",{p_n:n},true);nMesas=n;toast("✅ Mesas guardadas: "+n)}catch(x){toast(x.message,true)}}

function adminUsuarios(){
 return adminNav()+'<h1>Usuarios y roles</h1><p class="mut">Crea la cuenta (correo y contraseña) en Supabase → Authentication → Users y luego asígnale aquí su rol. Cada rol solo puede usar su propia sección.</p>'+
 (A||[]).map(u=>'<div class="card row"><span>'+esc(u.email||"(sin correo)")+'<div class="mut">'+esc(ROL[u.rol||""]||"Sin acceso")+'</div></span><select onchange="asignarRol(\''+u.id+'\',this.value)">'+["","cocina","mesero","admin"].map(r=>'<option value="'+r+'"'+((u.rol||"")===r?' selected':'')+'>'+ROL[r]+'</option>').join("")+'</select></div>').join("")}
async function asignarRol(id,r){try{await rpc("admin_asignar_rol",{p_user:id,p_rol:r||null},true);toast("✅ Rol actualizado");await load(true)}catch(x){toast(x.message,true);await load(true)}}
function sinRol(){return '<h1>Cuenta sin rol</h1><p class="mut">Tu cuenta todavía no tiene un rol asignado. Pide al gerente que te asigne uno (mesero o cocina).</p>'}
function restringido(){const h=INICIO[ses.rol];return '<h1>Acceso restringido</h1><p class="mut">Tu rol ('+esc(ROL[ses.rol]||ses.rol)+') no tiene acceso a esta sección.</p>'+(h?'<p><a class="b" href="#'+h+'">Ir a mi área</a></p>':'')}
function avisoRed(){return '<div class="card" style="border-color:var(--rd)">⚠️ '+esc(lastErr)+'</div>'}
function cabecera(){
 const R=route();let acc="";
 if(ses&&ses.rol&&R.t!=="cliente"&&R.t!=="landing")acc='<span class="acc">'+(ses.rol==="admin"&&R.t!=="personal"?'<a class="b" href="#personal">Panel</a>':'')+'<button class="g" onclick="logout()">Salir</button></span>';
 return '<img class="gallo" alt="" src="'+LOGO_GALLO+'"><img class="wm" alt="'+esc(NOMBRE)+'" src="'+LOGO_TEXTO+'">'+(acc||'<div class="lema">¡Las mejores alitas están aquí!</div>')}
function render(){
 const R=route(),el=$("#app");let h="";
 if(SB_URL.indexOf("PEGA_AQUI")>=0||SB_KEY.indexOf("PEGA_AQUI")>=0){el.innerHTML='<div class="card"><b>Falta un dato de configuración</b><p class="mut">Abre index.html con el Bloc de notas y pega la URL y la clave pública de tu proyecto de Supabase en las líneas que empiezan con const SB_URL y const SB_KEY.</p></div>';return}
 const staffRoute=R.t==="mesero"||R.t==="cocina"||R.t==="personal"||R.t==="admin";
 try{
  if(staffRoute&&!ses)h=gate();
  else if(staffRoute&&!ses.rol)h='<p class="mut">Cargando…</p>';
  else if(staffRoute&&ses.rol==="ninguno")h=sinRol();
  else if(staffRoute&&!puede(R.t))h=restringido();
  else if(R.t==="landing")h=landing();
  else if(R.t==="personal")h=home();
  else if(!loaded)h=errMsg?'<div class="card">No se pudo cargar: '+esc(errMsg)+'<p><button onclick="load(true)">Reintentar</button></p></div>':'<p class="mut">Cargando…</p>';
  else h=(lastErr?avisoRed():"")+(R.t==="cliente"?cliente(R.m):R.t==="admin"?(R.tab==="caja"?adminCaja():R.tab==="usuarios"?adminUsuarios():adminMenu()):R.t==="cocina"?cocina():mesero());
  $("#top").innerHTML=cabecera();
  el.innerHTML=h;
  $("#bar").innerHTML=barraHTML(R);
  $("#lb").innerHTML=lbHTML(R);
 }catch(e){el.innerHTML='<div class="card" style="border-color:var(--rd)">Error al mostrar la pantalla: '+esc(e.message)+'<p><button onclick="load(true)">Reintentar</button></p></div>'}
 if(R.t==="personal"&&ses&&puede("personal"))drawQR();
 if((R.t==="mesero"||R.t==="cocina")&&ses&&ses.rol)pantalla();
 if(R.t==="cliente"&&loaded)animMenu=false}
sync();
</script>
</body>
</html>
